<html "pt-BR">
    <!--Atribuir um título ao cabeçalho-->
    <head> 
        <!-- Esse "meta charset='UTF-8' - normaliza a programação em português, usado quando temos problemas com acentuação"-->
        <meta charset="UTF-8">
        <title>Aula 01 - DWI</title>
    </head>
    <!--Esse "bgcolor" é uma cor sólida no fundo da página e o "text" é a cor da fonte-->
    <!--Esse "link", "alink", "vlink", são as cores do link sem ser clicado, durante o click e após click-->
    <body bgcolor="#191970" text="white" link="white" alink="purple" vlink="white">
        <center> 
            <marquee behavior ="" scrollamount="9">
            <!--"h1" - tamanho da fonte / "b" - negrito / "u" - underline-->
            <h1><b>CADASTRO DE CLIENTES</h1>
            </marquee>    
            <!-- Esse marquee é pra fazer aquela animação de letras ou imagens mechendo de um lado pro outro-->
        </center>
        <form>
            <p>
                <fieldset>
                    <legend>Dados Pessoais:</legend>
                    <label>Nome do Cliente: </label><br>
                    <!-- "Input ='text'" - o tipo de entrada que vamos receber / "placeholder" - assim que o cliente digitar, irá substituir 
                     o que está ai / "size" - obviamente o tamanho do texto / "maxlength" - é o número máximo de caracteres que pode ser 
                     digitado / "requires = 'yes' - irá escrever "preencha este campo"-->
                    <input type="text" placeholder="Insira seu Nome" size="60" maxlength="60" required = "yes">
                    <p>
                        <label>Senha:</label><br>
                        <!-- O tipo "password" faz com que a senha seja digitada já oculta e em formato de senha"-->
                        <input type="password" size="20" maxlength = "20"> 
                    <p>
                        <!-- Esse tipo "date" já formata o botão automaticamente para o formato de data-->
                        <label>Selecione sua data de nascimento:</label><br>
                        <input type="date" value="dd-mm-yyyy">
                    <p>
                        <!-- Esse tipo "number" já formata o botão automaticamente para o formato de seleção numérica -->
                        <label>Selecione sua idade:</label><br>
                        <input type="number" min ="1" max="100">
                    <p>
                        <label>Selecione cursos de sua preferência:</label><br>
                        <!-- Aqui são listas - "ol" são listas organizadas por numeração crescente / "ul" é uma lista só com pontinhos, 
                        'sem organização'-->
                        <ul>
                            <li><input type="checkbox" name="cursos"> HTML </li>
                            <li><input type="checkbox" name="cursos"> CSS </li>
                            <li><input type="checkbox" name="cursos"> JAVA </li>
                            <li><input type="checkbox" name="cursos"> JAVASCRIPT </li>
                            <li><input type="checkbox" name="cursos"> PHP </li>
                            <li><input type="checkbox" name="cursos"> PYTHON </li>
                        </ul>
                    <p>
                        <label>Selecione uma cidade:</label><br>
                        <!-- Esse "select" seguidos com os "options" cria uma caixa de opções a selecionar-->
                        <select>
                            <option>Santo André</option>
                            <option>São Caetano</option>
                            <option>São Paulo</option>
                            <option>Mauá</option>
                            <option>Guarulhos</option>
                        </select>
                    <p>
                        <label>Observações gerais:</label><br>
                        <!--Esse "textarea" serve para colocar um bloco de texto com diversas linhas seguidas - Geralmente usadao para 
                        observações e coisas assim. / 'cols' é a porcentagem da tela que essa caixa vai cobrir / 'rows' é o tanto de 
                        linhas que terá na nossa caixa/'placeholder' é aquele
                        texto que será substituido ao escrever-->
                        <textarea cols="50" rows="10" placeholder="Insira aqui"></textarea>
                    </fieldset>
                    <p>
                        <!--É possível observar que fechamos o outro 'fieldset' 2 linhas acima e criamos outro 'fieldset' a partir daqui.
                        Esse imput type 'radio' é aquela bolinha que dá pra selecionar como opção.
                        ATENÇÃO: Esse comando 'onclick' é uma ação do HTML5 que executa algo ao clicar no botão / depois colocamos o 
                        "documento.bgColor" que serve para indicar que algo vai acontecer com a 'cor de fundo do documento' e lembrando que o 
                        'bgColor' é cor de preenchimento. / Depois usamos o 'fgColor', que é a cor da fonte-->
                    <fieldset>
                        <legend></legend>

                    <label>
                        <legend>Selecione a cor das fontes</legend>
                        <input type="radio" name = "corFonte" onclick="fgColor='Yellow'">Amarelo
                        <input type="radio" name = "corFonte" onclick="fgColor='Cyan'">Ciano
                        <input type="radio" name = "corFonte" onclick="fgColor='DarkSlateGray'">Verde Escuro
                        <input type="radio" name = "corFonte" onclick="fgColor='YellowGreen'">Amarelo Verde
                        <input type="radio" name = "corFonte" onclick="fgColor='Wheat'">Bege
                        <input type="radio" name = "corFonte" onclick="fgColor='Indigo'">Roxo
                        <input type="radio" name = "corFonte" onclick="fgColor='Maroon'">Vinho

                    </label> <p>


                        <label><legend>Escolha um tema:</legend></label>
                        <input type ="radio" name = "cor" onclick="document.bgColor='yellow';">Amarelo
                        <input type ="radio" name = "cor" onclick="document.bgColor='LightCyan';">Cyan
                        <input type ="radio" name = "cor" onclick="document.bgColor='Wheat'; ">Bege
                        <input type ="radio" name = "cor" onclick="document.bgColor='Indigo';">Roxo
                        <input type ="radio" name = "cor" onclick="document.bgColor='DarkSlateGray';">Verde
                        <input type ="radio" name = "cor" onclick="document.bgColor='MidnightBlue';">Azul
                        <input type ="radio" name = "cor" onclick="document.bgColor='MidnightBlue';">Default
                    </fieldset>
                
                <center>
                    <!--Todo o nosso código gira em torno do 'input type' - porque o que você coloca depois disso é o que o botão fazer-->
                    <input type="submit" value="ENVIAR">
                    <input type="reset" value="LIMPAR">
                    <!--Esses dois comandos sevem para "enviar" ou "limpar" os dados que colocaram no nosso site.
                    Quando damos um enviar e não preenchermos os dados que estão com "required = 'yes'", esses campos aparecem com 'preencha
                    este campo'
                    -->
                    <br>
                    <a href="https://www.fatecmaua.com.br/">Fale Conosco</a><br>
                    <a href="https://www.fatecmaua.com.br/"><img src="giphy.gif" width="50" height="50"></a> <br>

                </center>


            </form>
    </body>
</html>
